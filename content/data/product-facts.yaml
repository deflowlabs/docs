  benefitDescriptions:
    Standard Referrals: Earn 5% of platform fees from eligible invitees through the dual-bucket reward model.
    Deal Analytics: Personal deal-history dashboard with performance metrics and volume charts.
    Priority Support: Prioritised support handling for Bronze III and above.
    Two-Sided Referrals: Invitees receive a 10% discount on their first eligible trade.
    Verified Trader Badge: Verified status displayed with the user's platform profile.
    Smart Desk Branding: Desk logo, brand colours and vanity URL customisation.
    Pulse Analytics: Aggregated platform trends, volume heatmaps and market indicators.
    Blueprints: Reusable deal configurations for assets, amounts and terms.
    Forge API Read: API keys for exporting authorised deal, balance and analytics data.
    Forge API Execute: Programmatic creation, acceptance and management of authorised deals.
    Dedicated Channel: Direct private support channel with the DeFlow team.
    Master Rev-Share: Referral commission increases from 5% to 10%.
    Account Manager: Named contact for onboarding, integrations and account guidance.
    Horizon Spotlight: Priority visibility for eligible public marketplace deals.
    VIP Access Pass: Invitations to eligible DeFlow events and roundtables.
    Custom Fee Schedule: Eligibility to negotiate a desk-specific fee schedule.
    Early Access Programme: Prioritised access to selected prerelease features and feedback programmes.
    White-Label Fast Track: Priority white-label application with the setup fee waived; recurring and royalty fees remain applicable.
    Genesis Partner: Proposed co-marketing, case-study and strategic-advisory package; any governance or token element
      requires separate legal and governance approval.
