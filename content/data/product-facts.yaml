features:
  - id: account-and-identity
    label: Account and identity verification
    availability: private-beta
    note: Third-party verification runs in sandbox mode.
  - id: otc-settlement
    label: Bilateral OTC settlement
    availability: private-beta
    note: Uses Sepolia contracts and test assets.
  - id: syndicates
    label: Syndicate raises
    availability: private-beta
    note: Invited validation flow; implemented with FIFO allocation and one Sepolia escrow per approved investor. End-to-end
      validation is pending.
  - id: desks
    label: Team desks and invitations
    availability: private-beta
    note: Default desks, members, roles, invitations and activity records are implemented for beta coordination.
  - id: dashboard
    label: Dashboard and deal analytics
    availability: limited-beta
    note: Beta deal, volume and activity summaries are available; some telemetry remains simplified and is not a financial
      statement.
  - id: vip-and-referrals
    label: VIP progression and referrals
    availability: private-beta
    note: Cash withdrawal flows use TestUSDC.
  - id: partner-programme
    label: Partner programme
    availability: limited-beta
    note: Access and benefits are subject to onboarding and product readiness.
  - id: syndicate-pro-rata
    label: Pro-rata syndicate allocation
    availability: planned
    note: The beta uses FIFO; proportional oversubscription is not implemented.
  - id: syndicate-pooled-escrow
    label: Pooled syndicate escrow
    availability: planned
    note: The beta deploys one escrow per approved allocation; the pooled contract and on-chain SyndicateController are not
      implemented.
  - id: institutional-kyb
    label: Institutional KYB tiers
    availability: planned
    note: Individual sandbox verification is available; L2/L3 institutional onboarding is not launched.
  - id: asset-management
    label: Portfolio and risk analytics
    availability: planned
    note: Read-only analytics are roadmap functionality.
  - id: public-api
    label: Public API and SDK
    availability: planned
    note: No supported public developer interface is published.
