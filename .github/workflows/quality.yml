name: Documentation Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  SEMGREP_IMAGE: semgrep/semgrep:1.136.0@sha256:cda1b566fafbf6010a02a3ea1d265b1c8eba4380e489a13891a102243d81ca6f

jobs:
  quality:
    name: Content, Static Site & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Create read-only organisation token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.DEFLOW_CI_APP_ID }}
          private-key: ${{ secrets.DEFLOW_CI_APP_PRIVATE_KEY }}
          owner: deflowlabs
          repositories: core
          permission-contents: read
      - name: Check out documentation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: docs
          persist-credentials: false
      - name: Check out canonical product facts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: deflowlabs/core
          ref: stage
          path: core
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Record canonical source revision
        id: core-revision
        working-directory: core
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - id: check
        run: npm run check
      - id: generate
        run: npm run generate
      - run: npx --no-install playwright install --with-deps chromium
      - id: browser
        run: npm run test:e2e
      - id: audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-playwright-${{ github.sha }}
          path: |
            docs/playwright-report/
            docs/test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish documentation summary
        if: always()
        env:
          CORE_SHA: ${{ steps.core-revision.outputs.sha }}
          CHECK_RESULT: ${{ steps.check.outcome }}
          GENERATE_RESULT: ${{ steps.generate.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          {
            echo '## Documentation quality'
            echo
            echo "Canonical core revision: \`$CORE_SHA\`"
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo "| Content, facts and types | \`$CHECK_RESULT\` |"
            echo "| Static generation and SEO | \`$GENERATE_RESULT\` |"
            echo "| Browser and accessibility | \`$BROWSER_RESULT\` |"
            echo "| Production dependency audit | \`$AUDIT_RESULT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Source & Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint workflow syntax
        env:
          GOBIN: ${{ runner.temp }}/actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$GOBIN/actionlint" -color
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          min-severity: high
          online-audits: false
          persona: auditor
          version: 1.29.0
      - name: Scan secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: trivy-fs.json
          trivy-version: v0.72.0
      - name: Run repository Semgrep policy
        run: |
          mkdir -p .ci-reports/semgrep
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/semgrep-home -e XDG_CACHE_HOME=/tmp/semgrep-cache \
            -v "$PWD:/src:ro" -v "$PWD/.ci-reports/semgrep:/reports" \
            "$SEMGREP_IMAGE" semgrep scan --oss-only --no-git-ignore --config /src/.semgrep.yml --error --severity ERROR \
            --exclude '**/.git/**' --exclude '**/node_modules/**' --exclude '**/.nuxt/**' --exclude '**/.output/**' \
            --exclude '**/dist/**' --exclude '**/coverage/**' --exclude '**/playwright-report/**' --exclude '**/test-results/**' \
            --json-output /reports/semgrep.json /src/app /src/scripts /src/tests \
            /src/app.config.ts /src/content.config.ts /src/nuxt.config.ts
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'
          trivy-version: v0.72.0
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-security-${{ github.sha }}
          path: |
            trivy-fs.json
            sbom.cdx.json
            .ci-reports/semgrep/
          if-no-files-found: warn
          retention-days: 90

  required:
    name: Docs / Required
    if: always()
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required gates
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
        run: test "$QUALITY" = success && test "$SECURITY" = success
